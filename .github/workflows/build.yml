name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release として公開する場合のタグ名 (例: v0.2.1)。空なら Artifacts のみ"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm RaidClip.spec
      - name: Bundle ffmpeg (BtbN GPL build, fallback gyan.dev)
        shell: pwsh
        run: |
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $ok = $false
          foreach ($url in $urls) {
            for ($i = 1; $i -le 3 -and -not $ok; $i++) {
              try {
                Write-Host "Downloading $url (try $i)"
                Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -MaximumRetryCount 2 -RetryIntervalSec 5
                $ok = $true
              } catch {
                Write-Host "  failed: $($_.Exception.Message)"
                Start-Sleep -Seconds 10
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "ffmpeg download failed from all sources" }
          Expand-Archive ffmpeg.zip -DestinationPath ffbuild
          New-Item -ItemType Directory -Force dist/RaidClip/ffmpeg | Out-Null
          Get-ChildItem ffbuild -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination dist/RaidClip/ffmpeg/
          Get-ChildItem ffbuild -Recurse -Include LICENSE.txt,LICENSE | Select-Object -First 1 | Copy-Item -Destination dist/RaidClip/ffmpeg/LICENSE-ffmpeg.txt
          if (-not (Test-Path dist/RaidClip/ffmpeg/ffmpeg.exe)) { throw "ffmpeg.exe not found in archive" }
          Copy-Item README.md dist/RaidClip/
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/RaidClip -DestinationPath RaidClip-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RaidClip-windows
          path: RaidClip-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: RaidClip ${{ inputs.release_tag || github.ref_name }}
          files: RaidClip-windows.zip
          generate_release_notes: true
