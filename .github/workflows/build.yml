name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm RaidClip.spec
      - name: Bundle ffmpeg (BtbN GPL build)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffbuild
          New-Item -ItemType Directory -Force dist/RaidClip/ffmpeg | Out-Null
          Get-ChildItem ffbuild -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination dist/RaidClip/ffmpeg/
          Get-ChildItem ffbuild -Recurse -Filter LICENSE.txt | Select-Object -First 1 | Copy-Item -Destination dist/RaidClip/ffmpeg/LICENSE-ffmpeg.txt
          Copy-Item README.md dist/RaidClip/
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/RaidClip -DestinationPath RaidClip-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RaidClip-windows
          path: RaidClip-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RaidClip-windows.zip
